name: Match

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: match-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  usa:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/build.yml
    with:
      version: usa
      label: USA
      publish-badges: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', vars.BADGE_REF || github.event.repository.default_branch) }}
    secrets: inherit

  jpn:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/build.yml
    with:
      version: jpn
      label: JPN
      publish-badges: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', vars.BADGE_REF || github.event.repository.default_branch) }}
    secrets: inherit

  eur:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/build.yml
    with:
      version: eur
      label: EUR
      publish-badges: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', vars.BADGE_REF || github.event.repository.default_branch) }}
    secrets: inherit

  badges-usa:
    needs: usa
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', vars.BADGE_REF || github.event.repository.default_branch)
    uses: ./.github/workflows/publish-badges.yml
    with:
      version: usa
    permissions:
      contents: write
    concurrency:
      group: publish-badges
      cancel-in-progress: false

  badges-jpn:
    needs: jpn
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', vars.BADGE_REF || github.event.repository.default_branch)
    uses: ./.github/workflows/publish-badges.yml
    with:
      version: jpn
    permissions:
      contents: write
    concurrency:
      group: publish-badges
      cancel-in-progress: false

  badges-eur:
    needs: eur
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', vars.BADGE_REF || github.event.repository.default_branch)
    uses: ./.github/workflows/publish-badges.yml
    with:
      version: eur
    permissions:
      contents: write
    concurrency:
      group: publish-badges
      cancel-in-progress: false

  prready:
    needs: [usa, eur, jpn]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DQIX_REPO: ${{ github.workspace }}/source
      DQIX_KIT: ${{ github.workspace }}/kit
      DQIX_STATE: ${{ github.workspace }}/dqix-state
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 496212804aebff49edaead6be1a293ae24783b59
          fetch-depth: 0
          path: source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Clone current official kit and check readiness
        run: |
          git clone https://github.com/ZevyaDev/dqix-decomp-kit.git "$DQIX_KIT"
          mkdir -p "$DQIX_STATE"
          test "$(git -C "$DQIX_REPO" rev-parse HEAD)" = 496212804aebff49edaead6be1a293ae24783b59
          python "$DQIX_KIT/prready.py" decomp

  match:
    needs: usa
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          case "${{ needs.usa.result }}" in
            success|skipped) ;;
            *) echo "usa: ${{ needs.usa.result }}"; exit 1 ;;
          esac
